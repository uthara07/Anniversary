<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Anniversary!</title>
  <style>
    /* Turquoise Theme */
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
      background-color: #e0f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 450px;
      width: 100%;
    }

    .snoopy-header img {
      width: 140px;
      margin-bottom: 10px;
    }

    h1 {
      color: #00838f;
      font-size: 26px;
      margin-bottom: 15px;
    }

    /* Button */
    .open-btn {
      background-color: #00acc1;
      color: white;
      border: 3px solid #004d40;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 4px 4px 0px #004d40;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .open-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #004d40;
    }

    .envelope-wrapper {
      display: none;
      margin-top: 20px;
    }

    .envelope {
      background: #ffffff;
      border: 3px solid #00838f;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 6px 6px 0px rgba(0,131,143,0.2);
      position: relative;
    }

    .envelope::before {
      content: '🐾';
      font-size: 24px;
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      background: #e0f7fa;
      padding: 0 5px;
    }

    .letter {
      text-align: left;
      color: #004d40;
      line-height: 1.7;
      font-size: 15px;
      background: #f2fbfb;
      padding: 20px;
      border: 2px dashed #00acc1;
      border-radius: 8px;
    }

    .letter p {
      margin-bottom: 12px;
    }

    /* Clean Photo Gallery (No Polaroids, No Captions) */
    .photo-gallery {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 2px solid #00838f
