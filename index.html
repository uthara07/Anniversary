<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Anniversary!</title>
  <style>
    /* Snoopy Theme Colors: Soft yellow, white, and red */
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
      background-color: #fcf6bd; /* Snoopy-esque soft pastel yellow */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 450px;
      width: 100%;
    }

    .snoopy-header img {
      width: 140px;
      margin-bottom: 10px;
    }

    h1 {
      color: #d90429;
      font-size: 26px;
      margin-bottom: 15px;
    }

    /* "Click for message" Button */
    .open-btn {
      background-color: #d90429;
      color: white;
      border: 3px solid #000;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 4px 4px 0px #000;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .open-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000;
    }

    .open-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    /* Envelope & Letter Wrapper */
    .envelope-wrapper {
      display: none; /* Hidden until button click */
      margin-top: 20px;
      perspective: 1000px;
    }

    /* Envelope Styling */
    .envelope {
      background: #fff;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 6px 6px 0px rgba(0,0,0,0.15);
      position: relative;
      animation: openLetter 0.8s ease-out forwards;
    }

    /* Envelope Flap Accent */
    .envelope::before {
      content: '🐾';
      font-size: 24px;
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      background: #fcf6bd;
      padding: 0 5px;
    }

    /* The Letter Content */
    .letter {
      text-align: left;
      color: #2b2d42;
      line-height: 1.7;
      font-size: 15px;
      background: #fffdf0;
      padding: 20px;
      border: 2px dashed #d90429;
      border-radius: 8px;
    }

    .letter p {
      margin-bottom: 12px;
    }

    /* Photo Gallery inside the envelope */
    .photo-gallery {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    .photo-gallery img {
      width: 100%;
      border-radius: 10px;
      border: 2px solid #000;
    }

    /* Opening Animation */
    @keyframes openLetter {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.8);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="snoopy-header">
      <img src="https://upload.wikimedia.org/wikipedia/en/5/53/Snoopy_Peanuts.png" alt="Snoopy">
    </div>

    <h1>Happy Anniversary! ❤️</h1>

    <button class="open-btn" onclick="openEnvelope()">click for message 💌</button>
